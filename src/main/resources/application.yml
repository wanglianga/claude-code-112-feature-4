server:
  port: 8080

spring:
  application:
    name: city-laundry
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laundry}
    username: ${SPRING_DATASOURCE_USERNAME:laundry}
    password: ${SPRING_DATASOURCE_PASSWORD:laundry123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # 售后时限（天）
  after-sales-days: 7
  # 高价值衣物阈值（元），达到即进入专人复核流程
  high-value-threshold: 2000
  # 高风险衣物声明价值阈值（元）
  high-risk-value-threshold: 5000
  # 客户异常报价决策时限（小时），超时转人工队列
  decision-hours: 24

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
