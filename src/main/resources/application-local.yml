# 本地开发/验证 profile（无需 Docker/PostgreSQL）：
# 启动：SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
# 使用 H2 内存库（PostgreSQL 兼容模式），应用重启后数据重建。
server:
  port: 8080

spring:
  application:
    name: city-laundry
  datasource:
    url: jdbc:h2:mem:laundry;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  after-sales-days: 7
  high-value-threshold: 2000
  high-risk-value-threshold: 5000
  # 客户报价决策时限（小时）
  decision-hours: 24
