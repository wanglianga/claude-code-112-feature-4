services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laundry}
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库不发布到宿主端口，仅在 compose 内部网络提供服务
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laundry} -d ${POSTGRES_DB:-laundry}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-laundry}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-laundry}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-laundry123}
    # 仅把应用服务端口发布到宿主，宿主端口由 CC_PUBLISH_PORT 指定
    ports:
      - "${CC_PUBLISH_PORT:-3112}:8080"
    restart: unless-stopped

volumes:
  pgdata:
